schema_version: "1.1"
name: code-first-asks-before-building
expected_outcome: |
  The agent explores the repository (Vite + React, components in src/components/<Name>/<Name>.tsx, tokens kept by hand in src/styles/tokens.css, Storybook without addon-designs, no CI) and sends a plan: code as the source of truth, moving tokens.css into tokens.json, identical names instead of a props mapping table, links in both directions without Code Connect, CI with FIGMA_TOKEN and Chromatic, which the user sets up themselves. It waits for confirmation and does not change the project or Figma before then.
context:
  scaffold_script: place-files.sh
