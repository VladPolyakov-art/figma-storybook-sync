# Design system checks in CI: tokens ↔ code ↔ Storybook ↔ Figma. Goes to .github/workflows/ds.yml.
# Placeholders (replace on install): __APP_DIR__ is the folder with package.json (or "."),
#   __SYNC__ is the path to figma_sync.py from the repo root (for example scripts/ds/figma_sync.py).
# The user sets the secrets themselves: GitHub → Settings → Secrets and variables → Actions.
#   FIGMA_TOKEN             personal Figma token, scope file_content:read → the "Figma link" step;
#   CHROMATIC_PROJECT_TOKEN Chromatic project token (free plan) → the "Chromatic" step.
# Without a secret the step is skipped with a warning instead of failing.
name: ds

on:
  push:
  pull_request:

jobs:
  ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic compares against earlier builds using git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: __APP_DIR__/package-lock.json

      - name: Dependencies
        working-directory: __APP_DIR__
        run: npm ci

      - name: Tokens built (generated CSS matches tokens.json)
        working-directory: __APP_DIR__
        run: |
          npm run tokens:build
          git diff --exit-code || { echo "::error::tokens are stale: run npm run tokens:build and commit"; exit 1; }

      - name: Storybook builds
        working-directory: __APP_DIR__
        run: npm run build-storybook

      - name: Figma link (components, variants, map)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then echo "::warning::FIGMA_TOKEN secret is not set, Figma drift check skipped"; exit 0; fi
          python3 __SYNC__ fetch-rest --root .
          python3 __SYNC__ check --root . --figma .tmp/figma/rest.json --only components

      - name: Chromatic
        working-directory: __APP_DIR__
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then echo "::warning::CHROMATIC_PROJECT_TOKEN secret is not set, Storybook publishing skipped"; exit 0; fi
          npx -y chromatic --storybook-build-dir storybook-static --exit-zero-on-changes

      - name: Drift report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift
          path: .tmp/figma/drift.md
          if-no-files-found: ignore
